    <title>Plataforma de Ensino - Prof. Jeiverson Christian</title>

<body class="min-h-screen flex flex-col">
    <main class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="max-w-2xl w-full text-center">
            
            <!-- Foto do Professor -->
            <div class="relative w-40 h-40 mx-auto mb-8">
                <img src="imgs/foto_prof_jeiverson.png" alt="Prof. Jeiverson Christian" class="w-full h-full object-cover rounded-full border-4 border-blue-500 shadow-[0_0_30px_rgba(59,130,246,0.3)]">
            </div>
            
            <h1 class="text-4xl md:text-5xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                Aulas do Prof. Jeiverson
            </h1>
            <p class="text-slate-400 text-lg mb-12">Física e Matemática — Videoaulas Interativas</p>

            <!-- Botões de Navegação -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-lg mx-auto">
                <!-- Link para a página da OBMEP -->
                <a href="obmep/index.html" class="bg-slate-800 border border-slate-700 rounded-xl p-8 flex flex-col items-center justify-center group cursor-pointer text-decoration-none transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_10px_25px_-5px_rgba(59,130,246,0.5)]">

                    <h2 class="text-2xl font-bold text-slate-200 group-hover:text-blue-400 transition-colors">OBMEP</h2>
                    <p class="text-slate-500 text-sm mt-2">Resoluções Animadas</p>
                </a>

                <!-- Link para o ITA (futuro) -->
                <a href="#" class="bg-slate-800 border border-slate-700 rounded-xl p-8 flex flex-col items-center justify-center group cursor-not-allowed opacity-60">
                    <div class="text-5xl mb-4">🚀</div>
                    <h2 class="text-2xl font-bold text-slate-200">ITA</h2>
                    <p class="text-slate-500 text-sm mt-2">Em breve...</p>
                </a>
            </div>
        </div>
