<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMEP 2025 - Nível 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a0b14; color: #fdf2f8; font-family: system-ui, -apple-system, sans-serif; }
        .top-bar { position: fixed; top: 1.5rem; left: 1.5rem; display: flex; gap: 0.75rem; z-index: 200; }
        .top-btn { background: #2e1222; color: #f9a8d4; border: 1px solid #592242; padding: 0.6rem 1rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; font-family: inherit; }
        .top-btn:hover { background: #451a33; color: #fff; }
    </style>
</head>
<body class="min-h-screen p-6 pt-24">
    
    <div class="top-bar">
        <!-- Volta 3 níveis para a raiz (2025 -> nível 2 -> obmep -> raiz) -->
        <a href="../../../index.html" class="top-btn" title="Ir para a Página Inicial">🏠 Página Inicial</a>
        <a href="#" onclick="history.back(); return false;" class="top-btn" title="Página Anterior">⬅️ Voltar</a>
    </div>

    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <span class="inline-block px-4 py-1 rounded-full text-sm font-semibold bg-pink-950/80 text-pink-300 border border-pink-500/40 mb-3">
                8º e 9º Ano
            </span>
            <h1 class="text-3xl md:text-4xl font-bold text-pink-400">OBMEP 2025 — Nível 2</h1>
            <p class="text-pink-200/70 mt-2">Selecione uma questão para assistir à resolução interativa</p>
        </div>
        
        <div id="questions-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4">
            <!-- Gerado via JavaScript -->
        </div>
    </div>

    <script>
        // Mapeamento das questões já disponíveis na pasta nível 2/2025
        const activeQuestions = {
            1: { file: 'questao_1_nivel_2.html', topic: 'Área do Octógono' },
            2: { file: 'questao_2_nivel_2.html', topic: 'Círculos Conectados' },
            3: { file: 'questao_3_nivel_2.html', topic: 'Folha Dobrada' },
            4: { file: 'questao_4_nivel_2.html', topic: 'Velocidade da Moto' }
        };

        const grid = document.getElementById('questions-grid');
        let html = '';

        for (let q = 1; q <= 20; q++) {
            if (activeQuestions[q]) {
                const item = activeQuestions[q];
                html += `
                    <a href="${item.file}" class="bg-[#2b1120] hover:bg-pink-600/90 border border-pink-500/60 hover:border-pink-300 rounded-xl p-5 flex flex-col items-center justify-center text-center transition-all duration-200 shadow-[0_0_12px_rgba(236,72,153,0.2)] hover:shadow-[0_0_20px_rgba(236,72,153,0.5)] hover:-translate-y-1 group" title="Abrir Questão ${q}">
                        <span class="text-2xl font-bold text-pink-300 group-hover:text-white">Questão ${q}</span>
                        <span class="text-xs text-pink-200/70 group-hover:text-pink-100 mt-1.5">${item.topic}</span>
                    </a>
                `;
            } else {
                html += `
                    <div class="bg-[#2b1120]/40 border border-[#592242]/40 rounded-xl p-5 flex flex-col items-center justify-center text-center cursor-not-allowed opacity-50" title="Em breve...">
                        <span class="text-xl font-semibold text-pink-200/40">Questão ${q}</span>
                        <span class="text-xs text-pink-200/30 mt-1.5">Em breve...</span>
                    </div>
                `;
            }
        }

        grid.innerHTML = html;
    </script>
</body>
</html>
