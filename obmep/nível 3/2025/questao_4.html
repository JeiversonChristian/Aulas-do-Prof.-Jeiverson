<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolução OBMEP Animada</title>
    <style>
        /* Base e Reset */
        body { 
            margin: 0; 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }

        /* Ferramentas do Professor */
        :root { --pen-color: #f43f5e; --pen-bg: #4c0519; }
        .top-bar { position: fixed; top: 1.5rem; left: 1.5rem; display: flex; gap: 0.75rem; z-index: 200; }
        .tool-group { position: relative; }
        .top-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 0.6rem 1rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; font-family: inherit; }
        .top-btn:hover { background: #334155; color: #fff; }
        .top-btn.active-pen { background: var(--pen-bg); border-color: var(--pen-color); color: var(--pen-color); box-shadow: 0 0 12px var(--pen-color); }
        .top-btn.active-eraser { background: #451a03; border-color: #fbbf24; color: #fbbf24; box-shadow: 0 0 12px rgba(251, 191, 36, 0.4); }
        
        .tool-menu { position: absolute; top: calc(100% + 0.5rem); left: 0; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); opacity: 1; transition: opacity 0.2s; pointer-events: auto; min-width: 140px; }
        .tool-menu.hidden { opacity: 0; pointer-events: none; }
        .menu-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #cbd5e1; }
        .color-btn { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: #fff; box-shadow: 0 0 8px currentColor; }
        input[type="range"] { flex: 1; width: 100%; cursor: pointer; }

        .webcam-box { position: fixed; top: 24px; left: calc(100vw - 184px); width: 160px; height: 120px; min-width: 100px; min-height: 80px; background: rgba(15, 23, 42, 0.4); border: 2px dashed #475569; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9rem; z-index: 100; backdrop-filter: blur(4px); user-select: none; touch-action: none; }
        
        .resize-handle { position: absolute; width: 12px; height: 12px; background: #475569; border: 1px solid #cbd5e1; border-radius: 50%; z-index: 10; }
        .resize-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .resize-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .resize-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .resize-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
        
        #draw-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 150; }
        
        /* Layout Principal */
        .container { 
            background: #1e293b; 
            padding: 2.5rem; 
            border-radius: 1rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            max-width: 850px; 
            width: 90%; 
            border: 1px solid #334155; 
            position: relative; 
            display: flex;
            flex-direction: column;
        }
        
        /* Cabeçalho */
        .header { text-align: center; margin-bottom: 1.5rem; border-bottom: 2px solid #3b82f6; padding-bottom: 1rem; }
        .header h1 { margin: 0; font-size: 1.5rem; color: #60a5fa; letter-spacing: 1px; text-transform: uppercase; }
        
        /* Questão */
        .question-box { 
            background: #0f172a; 
            padding: 1.2rem; 
            border-left: 4px solid #f59e0b; 
            border-radius: 0.5rem; 
            margin-bottom: 1.5rem; 
            font-size: 1.1rem; 
            line-height: 1.6; 
        }
        
        /* Fração Estática (para o enunciado) */
        .static-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 0.3rem; font-family: 'Times New Roman', Times, serif; font-size: 1.2rem; }
        .static-frac span:first-child { border-bottom: 1.5px solid #f8fafc; padding: 0.1rem 0.3rem; line-height: 1; }
        .static-frac span:last-child { padding: 0.1rem 0.3rem; line-height: 1; }
        .math-text { font-family: 'Times New Roman', Times, serif; font-style: italic; }

        /* Área da Animação */
        .presentation-area {
            background: #334155;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            padding: 2rem;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }

        .explanation {
            text-align: center;
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            min-height: 3rem;
            transition: opacity 0.3s ease;
        }

        .board {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 1.8rem;
            font-family: 'Times New Roman', Times, serif;
        }

        /* Estruturas Matemáticas Dinâmicas (Corrigido white-space para evitar quebras acidentais) */
        .row { display: flex; align-items: center; justify-content: center; }
        .frac { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 10px; }
        .num { border-bottom: 2px solid #f8fafc; padding: 2px 8px; display: flex; align-items: center; justify-content: center; }
        .den { padding: 2px 8px; display: flex; align-items: center; justify-content: center; }
        
        .anim { 
            display: inline-block; 
            white-space: nowrap; 
            will-change: transform, opacity;
        }
        .math { font-style: italic; }
        
        /* Barra de Progresso */
        .progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 1.5rem;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #475569;
            transition: background 0.3s, transform 0.3s;
        }
        .dot.active {
            background: #3b82f6;
            transform: scale(1.3);
        }

        /* Confetti */
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; opacity: 0; z-index: 50;}
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Opções de Resposta */
        .options-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            background: #0f172a;
            padding: 1rem;
            border-left: 4px solid #3b82f6;
            border-radius: 0.5rem;
            font-size: 1.1rem;
        }
        .opt {
            padding: 0.4rem 1rem;
            border-radius: 0.4rem;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            transition: all 0.5s ease;
        }
        .opt.correct {
            background: #166534;
            color: #fff;
            border-color: #22c55e;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(34,197,94,0.4);
            font-weight: bold;
        }

        /* Cores Matemáticas Base */
        .c-26 { color: #60a5fa; } /* Azul para 2026 */
        .c-25 { color: #c084fc; } /* Roxo para 2025 */
        .c-k { color: #fbbf24; font-weight: bold; } /* Amarelo para k */
        .c-op { color: #94a3b8; } /* Cinza claro para operadores */
        .c-hl { color: #f43f5e; font-weight: bold; text-shadow: 0 0 8px rgba(244,63,94,0.6); } /* Destaque para mudanças */
        .c-res { color: #34d399; font-weight: bold; } /* Verde para resultados */

        /* Classes de Destaque Controlado (Prévia Visual) */
        @keyframes blink {
            0%, 100% { opacity: 1; color: #f43f5e; text-shadow: 0 0 10px #f43f5e; transform: scale(1.15); }
            50% { opacity: 0.4; color: inherit; text-shadow: none; transform: scale(1); }
        }
        .blink-me { animation: blink 1s ease-in-out infinite; display: inline-block; }
        
        .cross-red { color: #ef4444 !important; text-shadow: 0 0 12px rgba(239,68,68,0.7); transform: scale(1.1); z-index: 10; transition: all 0.3s; }
        .cross-blue { color: #3b82f6 !important; text-shadow: 0 0 12px rgba(59,130,246,0.7); transform: scale(1.1); z-index: 10; transition: all 0.3s; }
        
        .hl-yellow { color: #fcd34d !important; text-shadow: 0 0 12px rgba(251,191,36,0.8); transform: scale(1.15); z-index: 10; transition: all 0.3s; }
        .hl-mirror { filter: drop-shadow(0 0 10px rgba(251,191,36,0.5)); transform: scale(1.05); transition: all 0.3s; }
    </style>
</head>
<body>
    
    <!-- Definição de SVG Global para Setas -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
        <defs>
            <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0,0 L0,6 L6,3 z" fill="#ef4444" />
            </marker>
            <marker id="arr-blu" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0,0 L0,6 L6,3 z" fill="#3b82f6" />
            </marker>
        </defs>
    </svg>

    <!-- Controles Topo -->
    <div class="top-bar">
        <a href="../../../index.html" class="top-btn" title="Ir para a Página Inicial">🏠 Página Inicial</a>
        <a href="#" onclick="history.back(); return false;" class="top-btn" title="Página Anterior">⬅️ Voltar</a>

        <div class="tool-group">
            <button id="btn-pen" class="top-btn" title="Ativar/Desativar Caneta">🖌️ Caneta</button>
            <div id="pen-menu" class="tool-menu hidden">
                <div class="menu-row">
                    <span class="color-btn active" data-color="#f43f5e" style="background:#f43f5e" title="Vermelho Laser"></span>
                    <span class="color-btn" data-color="#22c55e" style="background:#22c55e" title="Verde Laser"></span>
                </div>
                <div class="menu-row">
                    <label>Tamanho:</label>
                    <input type="range" id="pen-size" min="1" max="15" value="4">
                </div>
            </div>
        </div>
        <div class="tool-group">
            <button id="btn-eraser" class="top-btn" title="Ativar/Desativar Borracha">🧽 Borracha</button>
            <div id="eraser-menu" class="tool-menu hidden">
                <div class="menu-row">
                    <label>Tamanho:</label>
                    <input type="range" id="eraser-size" min="10" max="100" value="40">
                </div>
            </div>
        </div>
    </div>

    <!-- Espaço da Câmera (Webcam) -->
    <div id="webcam" class="webcam-box">
        <span>📹 Espaço da Câmera</span>
        <div class="resize-handle nw"></div>
        <div class="resize-handle ne"></div>
        <div class="resize-handle sw"></div>
        <div class="resize-handle se"></div>
    </div>

    <!-- Lousa de Desenho Interativa -->
    <canvas id="draw-canvas"></canvas>

    <div class="container">
        <div class="header">
            <h1>Aula Prática — OBMEP</h1>
        </div>

        <div class="question-box">
            <strong>Questão 4:</strong> O número obtido subtraindo um inteiro positivo <span class="math-text">k</span> do numerador e do denominador da fração 
            <div class="static-frac"><span>2026</span><span>2025</span></div> 
            é igual a 
            <div class="static-frac"><span>2025</span><span>2026</span></div>. 
            Qual é a soma dos algarismos de <span class="math-text">k</span>?
        </div>

        <div class="options-container" id="options-box">
            <div id="optA" class="opt">(A) 9</div>
            <div id="optB" class="opt">(B) 10</div>
            <div id="optC" class="opt">(C) 33</div>
            <div id="optD" class="opt">(D) 42</div>
            <div id="optE" class="opt">(E) 44</div>
        </div>

        <div class="presentation-area">
            <div class="explanation" id="explanation">Iniciando...</div>
            <div class="board" id="board">
                <!-- Elementos dinâmicos entram aqui via JS -->
            </div>
        </div>

        <div class="progress" id="progress-bar"></div>
    </div>

    <script>
        // --- SISTEMA DE LOUSA (CANVAS) ---
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const btnPen = document.getElementById('btn-pen');
        const btnEraser = document.getElementById('btn-eraser');
        
        const penMenu = document.getElementById('pen-menu');
        const eraserMenu = document.getElementById('eraser-menu');
        const colorBtns = document.querySelectorAll('.color-btn');
        const penSizeInput = document.getElementById('pen-size');
        const eraserSizeInput = document.getElementById('eraser-size');
        
        let currentTool = 'none';
        let penColor = '#f43f5e';
        let penSize = 4;
        let eraserSize = 40;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                penColor = btn.dataset.color;
                setupCanvasCtx();
                updateCursor();
            });
        });

        penSizeInput.addEventListener('input', (e) => { penSize = e.target.value; setupCanvasCtx(); });
        eraserSizeInput.addEventListener('input', (e) => { eraserSize = e.target.value; setupCanvasCtx(); });

        function updateCursor() {
            if (currentTool === 'pen') {
                const colorHex = penColor.replace('#', '%23');
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${colorHex}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`;
                document.body.style.cursor = `url('data:image/svg+xml;utf8,${svg}') 2 22, crosshair`;
            } else if (currentTool === 'eraser') {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23fbbf24" stroke="%23451a03" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L2 15l9-9 9 9-5 5z"></path><path d="M11 6l9 9"></path></svg>`;
                document.body.style.cursor = `url('data:image/svg+xml;utf8,${svg}') 2 22, crosshair`;
            } else {
                document.body.style.cursor = 'default';
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            setupCanvasCtx();
        }
        
        function setupCanvasCtx() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = eraserSize;
                ctx.shadowBlur = 0;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = penColor;
                ctx.shadowColor = penColor;
                ctx.lineWidth = penSize;
                ctx.shadowBlur = 6;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toggleTool(tool) {
            if (currentTool === tool) currentTool = 'none';
            else currentTool = tool;
            
            btnPen.classList.remove('active-pen');
            btnEraser.classList.remove('active-eraser');
            penMenu.classList.add('hidden');
            eraserMenu.classList.add('hidden');
            
            if (currentTool === 'pen') {
                btnPen.classList.add('active-pen');
                penMenu.classList.remove('hidden');
                canvas.style.pointerEvents = 'auto';
                ctx.globalCompositeOperation = 'source-over';
                setupCanvasCtx();
            } else if (currentTool === 'eraser') {
                btnEraser.classList.add('active-eraser');
                eraserMenu.classList.remove('hidden');
                canvas.style.pointerEvents = 'auto';
                ctx.globalCompositeOperation = 'destination-out';
                setupCanvasCtx();
            } else {
                canvas.style.pointerEvents = 'none';
            }
            updateCursor();
        }

        btnPen.addEventListener('click', () => toggleTool('pen'));
        btnEraser.addEventListener('click', () => toggleTool('eraser'));

        function startDrawing(e) {
            if (currentTool === 'none') return;
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing || currentTool === 'none') return;
            e.preventDefault(); 
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() { isDrawing = false; }

        function getPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);

        // --- SISTEMA DE REDIMENSIONAMENTO DA WEBCAM ---
        const webcam = document.getElementById('webcam');
        const handles = document.querySelectorAll('.resize-handle');
        let isResizing = false;
        let activeHandle = null;
        let startW, startH, startX, startY, startMouseX, startMouseY;

        handles.forEach(handle => {
            handle.addEventListener('mousedown', initResize);
            handle.addEventListener('touchstart', initResize, {passive: false});
        });

        function initResize(e) {
            let evt = e;
            if (e.type === 'touchstart') {
                e.preventDefault();
                evt = e.touches[0];
            }
            isResizing = true;
            activeHandle = e.target;
            const rect = webcam.getBoundingClientRect();
            startW = rect.width;
            startH = rect.height;
            startX = rect.left;
            startY = rect.top;
            startMouseX = evt.clientX;
            startMouseY = evt.clientY;
            
            document.addEventListener('mousemove', resizeWebcam);
            document.addEventListener('mouseup', stopResize);
            document.addEventListener('touchmove', handleTouchResize, {passive: false});
            document.addEventListener('touchend', stopResize);
        }
        
        function handleTouchResize(e) { e.preventDefault(); resizeWebcam(e.touches[0]); }

        function resizeWebcam(e) {
            if (!isResizing) return;
            const dx = e.clientX - startMouseX;
            const dy = e.clientY - startMouseY;
            const handleClass = activeHandle.className;
            let newW = startW; let newH = startH; let newX = startX; let newY = startY;

            if (handleClass.includes('se')) { newW = startW + dx; newH = startH + dy; } 
            else if (handleClass.includes('sw')) { newW = startW - dx; newH = startH + dy; newX = startX + dx; } 
            else if (handleClass.includes('ne')) { newW = startW + dx; newH = startH - dy; newY = startY + dy; } 
            else if (handleClass.includes('nw')) { newW = startW - dx; newH = startH - dy; newX = startX + dx; newY = startY + dy; }

            if (newW >= 100) { webcam.style.width = newW + 'px'; webcam.style.left = newX + 'px'; }
            if (newH >= 80) { webcam.style.height = newH + 'px'; webcam.style.top = newY + 'px'; }
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', resizeWebcam);
            document.removeEventListener('mouseup', stopResize);
            document.removeEventListener('touchmove', handleTouchResize);
            document.removeEventListener('touchend', stopResize);
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // --- FLUXO DE DADOS: PREVIEW -> EXECUTE ---
        const stepsData = [
            { // 0: Tela Inicial
                text: "Pronto para começar? Use as setas do teclado (➔) para avançar os passos da resolução.",
                html: `<div class="row" style="height: 100%; display: flex; align-items: center;">
                        <span class="anim" style="font-size: 5rem; color: #3b82f6; filter: drop-shadow(0 0 15px rgba(59,130,246,0.5));">▶</span>
                      </div>`
            },
            { // 1: Fração inicial
                text: "Começamos com a fração descrita no problema:",
                html: `<div class="row">
                        <div class="frac">
                            <div class="num"><span id="n1" class="anim c-26">2026</span></div>
                            <div class="den"><span id="d1" class="anim c-25">2025</span></div>
                        </div>
                      </div>`
            },
            { // 2: Subtrair k (Prévia piscando)
                text: "O enunciado diz que subtraímos um valor 'k' do numerador e denominador, igualando a 2025/2026:",
                html: `<div class="row">
                        <div class="frac">
                            <div class="num"><span id="n1" class="anim c-26">2026</span><span id="min1" class="anim math c-op blink-me" style="margin-left:4px;">−</span><span id="k1" class="anim math c-k blink-me" style="margin-left:4px;">k</span></div>
                            <div class="den"><span id="d1" class="anim c-25">2025</span><span id="min2" class="anim math c-op blink-me" style="margin-left:4px;">−</span><span id="k2" class="anim math c-k blink-me" style="margin-left:4px;">k</span></div>
                        </div>
                      </div>`
            },
            { // 3: Subtrair k (Execução - para de piscar e mostra o igual)
                text: "O enunciado diz que subtraímos um valor 'k' do numerador e denominador, igualando a 2025/2026:",
                html: `<div class="row">
                        <div class="frac">
                            <div class="num"><span id="n1" class="anim c-26">2026</span><span id="min1" class="anim math c-op" style="margin-left:4px;">−</span><span id="k1" class="anim math c-k" style="margin-left:4px;">k</span></div>
                            <div class="den"><span id="d1" class="anim c-25">2025</span><span id="min2" class="anim math c-op" style="margin-left:4px;">−</span><span id="k2" class="anim math c-k" style="margin-left:4px;">k</span></div>
                        </div>
                        <span id="eq" class="anim c-op" style="margin: 0 15px;"> = </span>
                        <div class="frac">
                            <div class="num"><span id="n2" class="anim c-25">2025</span></div>
                            <div class="den"><span id="d2" class="anim c-26">2026</span></div>
                        </div>
                      </div>`

                            <svg width="100%" height="15" viewBox="0 0 100 15" preserveAspectRatio="none" style="margin-top:2px; overflow:visible;">
                                <path d="M0,0 C0,15 45,15 50,15 C55,15 100,15 100,0" fill="none" stroke="#fcd34d" stroke-width="2"/>
                            </svg>
                            <span class="anim math" style="color:#fcd34d; font-size:1.5rem; font-weight:bold; margin-top:5px;">4051</span>
                        </span>
                      </div>`
            },
            { // 23: Resolver Parênteses (Execução)
                text: "Resolvemos as subtrações e somas simples dentro dos parênteses:",
                html: `<div class="row">
                        <span id="k_final" class="anim math c-k">k</span>
                        <span id="eq" class="anim c-op" style="margin: 0 15px;"> = </span>
                        
                        <span id="res1" class="anim c-res">1</span>
                        
                        <span id="dot5" class="anim c-op" style="margin: 0 12px;">×</span>
                        
                        <span id="res2" class="anim c-res">4051</span>
                      </div>`
            },
            { // 24: Encontrar k (Prévia)
                text: "Como qualquer número multiplicado por 1 é ele mesmo, encontramos o valor de k:",
                html: `<div class="row">
                        <span id="k_final" class="anim math c-k">k</span>
                        <span id="eq" class="anim c-op" style="margin: 0 15px;"> = </span>
                        
                        <span id="res1" class="anim c-res hl-yellow">1</span>
                        <span id="dot5" class="anim c-op hl-yellow" style="margin: 0 12px;">×</span>
                        <span id="res2" class="anim c-res hl-yellow">4051</span>
                      </div>`
            },
            { // 25: Encontrar k (Execução)
                text: "Como qualquer número multiplicado por 1 é ele mesmo, encontramos o valor de k:",
                html: `<div class="row">
                        <span id="k_final" class="anim math c-k" style="font-size: 2.5rem;">k</span>
                        <span id="eq" class="anim c-op" style="margin: 0 15px; font-size: 2.5rem;"> = </span>
                        <span id="res2" class="anim c-k" style="font-size: 2.5rem;">4051</span>
                      </div>`
            },
            { // 26: Soma dos algarismos (Prévia)
                text: "Por fim, o enunciado pede a soma dos algarismos do valor k encontrado:",
                html: `<div class="row">
                        <span id="k_final" class="anim math c-k" style="font-size: 2.5rem;">k</span>
                        <span id="eq" class="anim c-op" style="margin: 0 15px; font-size: 2.5rem;"> = </span>
                        <span id="res2" class="anim c-k hl-yellow" style="font-size: 2.5rem;">4051</span>
                      </div>`
            },
            { // 27: Soma dos algarismos (Execução Final)
                text: "Por fim, o enunciado pede a soma dos algarismos do valor k encontrado:",
                html: `<div class="row" style="opacity: 0.4;">
                        <span id="k_final" class="anim math c-k" style="font-size: 1.5rem;">k</span>
                        <span id="eq" class="anim c-op" style="margin: 0 10px; font-size: 1.5rem;"> = </span>
                        <span id="res2" class="anim c-k" style="font-size: 1.5rem;">4051</span>
                      </div>
                      <div class="row" style="margin-top:20px; color:#60a5fa;">
                        <span id="sum1" class="anim">Soma: 4 + 0 + 5 + 1</span>
                        <span id="eq2" class="anim c-op" style="margin: 0 15px;"> = </span>
                        <span id="sum2" class="anim c-res" style="font-size: 3rem;">10</span>
                      </div>
                      <div class="row" style="margin-top:30px; background:#166534; padding: 15px 40px; border-radius: 12px; border: 2px solid #22c55e; box-shadow: 0 0 25px rgba(34,197,94,0.4);">
                        <span id="ans" class="anim" style="color:#fff; font-family: system-ui, sans-serif; font-size:1.5rem; font-weight: bold;">Alternativa (B)</span>
                      </div>`
            }
        ];

        let currentStep = 0;
        let isAnimating = false;
        let audioCtx;

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playTone(freq, type, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playPopSound() { initAudio(); playTone(600, 'sine', 0.1, 0.1); setTimeout(() => playTone(900, 'sine', 0.15, 0.05), 50); }
        function playBackSound() { initAudio(); playTone(400, 'sine', 0.1, 0.05); }
        function playSuccessSound() {
            initAudio();
            playTone(440, 'triangle', 0.1, 0.1);
            setTimeout(() => playTone(554, 'triangle', 0.1, 0.1), 100);
            setTimeout(() => playTone(659, 'triangle', 0.1, 0.1), 200);
            setTimeout(() => playTone(880, 'triangle', 0.5, 0.15), 300);
        }

        function createConfetti() {
            const colors = ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#a855f7'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `fall ${Math.random() * 2 + 1.5}s linear forwards`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3500);
            }
        }

        const progressContainer = document.getElementById('progress-bar');
        stepsData.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = `dot ${i === 0 ? 'active' : ''}`;
            progressContainer.appendChild(dot);
        });

        // Calcula dinamicamente as coordenadas exatas das setas do chuveirinho (Passo 6)
        function updateDistributiveArrows() {
            const pairs = [
                { container: 'dist-left', from: 'd2', to1: 'n1', to2: 'k1', p1: 'path-l1', p2: 'path-l2' },
                { container: 'dist-right', from: 'n2', to1: 'd1', to2: 'k2', p1: 'path-r1', p2: 'path-r2' }
            ];
            pairs.forEach(({ container, from, to1, to2, p1, p2 }) => {
                const box = document.getElementById(container);
                const elFrom = document.getElementById(from);
                const elTo1 = document.getElementById(to1);
                const elTo2 = document.getElementById(to2);
                const path1 = document.getElementById(p1);
                const path2 = document.getElementById(p2);
                if (box && elFrom && elTo1 && elTo2 && path1 && path2) {
                    const x0 = elFrom.offsetLeft + elFrom.offsetWidth / 2;
                    const x1 = elTo1.offsetLeft + elTo1.offsetWidth / 2;
                    const x2 = elTo2.offsetLeft + elTo2.offsetWidth / 2;
                    path1.setAttribute('d', `M ${x0},30 Q ${(x0 + x1) / 2},-5 ${x1},30`);
                    path2.setAttribute('d', `M ${x0},30 Q ${(x0 + x2) / 2},-22 ${x2},30`);
                }
            });
        }

        // Motor de Animação Simplificado - Acionado a cada clique sem pausas automáticas
        function renderStep(idx, goingForward) {
            if (isAnimating) return;
            isAnimating = true;
            
            const board = document.getElementById('board');
            const exp = document.getElementById('explanation');
            const data = stepsData[idx];

            // Atualiza o texto imediatamente
            exp.textContent = data.text;
            exp.style.opacity = '1';

            // Registra posições antigas
            const oldEls = document.querySelectorAll('.anim');
            const rects = new Map();
            oldEls.forEach(el => {
                if (el.id) rects.set(el.id, el.getBoundingClientRect());
            });

            // Troca o HTML
            board.innerHTML = data.html;

            // Ajusta as setas da distributiva caso estejam presentes no passo atual
            updateDistributiveArrows();

            const newEls = document.querySelectorAll('.anim');
            
            newEls.forEach(el => {
                const oldRect = el.id ? rects.get(el.id) : null;
                if (oldRect) {
                    const newRect = el.getBoundingClientRect();
                    const dx = oldRect.left - newRect.left;
                    const dy = oldRect.top - newRect.top;
                    
                    if (dx !== 0 || dy !== 0) {
                        el.style.transform = `translate(${dx}px, ${dy}px)`;
                        el.style.transition = 'none';
                        el.getBoundingClientRect(); // Reflow
                        el.style.transition = 'transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        el.style.transform = 'translate(0, 0)';
                    }
                } else {
                    el.style.opacity = '0';
                    el.style.transform = 'scale(0.5)';
                    el.style.transition = 'none';
                    el.getBoundingClientRect(); // Reflow
                    el.style.transition = 'opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    el.style.opacity = '1';
                    el.style.transform = 'scale(1)';
                }
            });

            oldEls.forEach(el => {
                if (el.id && !document.getElementById(el.id)) {
                    const clone = el.cloneNode(true);
                    const rect = rects.get(el.id);
                    clone.style.position = 'fixed';
                    clone.style.left = rect.left + 'px';
                    clone.style.top = rect.top + 'px';
                    clone.style.margin = '0';
                    clone.style.pointerEvents = 'none';
                    clone.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    document.body.appendChild(clone);
                    clone.getBoundingClientRect();
                    clone.style.opacity = '0';
                    clone.style.transform = 'scale(0.5)';
                    setTimeout(() => clone.remove(), 500);
                }
            });

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.className = `dot ${i === idx ? 'active' : ''}`;
            });

            if (idx === stepsData.length - 1) {
                document.getElementById('optB').classList.add('correct');
            } else {
                document.getElementById('optB').classList.remove('correct');
            }

            if (goingForward) {
                if (idx === stepsData.length - 1) {
                    setTimeout(() => { playSuccessSound(); createConfetti(); }, 400);
                } else {
                    playPopSound();
                }
            } else {
                playBackSound();
            }

            setTimeout(() => { isAnimating = false; }, 900);
        }

        function nextStep() {
            if (currentStep < stepsData.length - 1) {
                clearCanvas();
                currentStep++;
                renderStep(currentStep, true);
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                clearCanvas();
                currentStep--;
                renderStep(currentStep, false);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
                nextStep();
            } else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) {
                e.preventDefault();
                prevStep();
            }
        });

        window.addEventListener('resize', updateDistributiveArrows);

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('board').innerHTML = stepsData[0].html;
            document.getElementById('explanation').textContent = stepsData[0].text;
        });

    </script>
</body>
